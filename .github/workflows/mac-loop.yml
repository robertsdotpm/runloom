# mac-loop -- AMPLIFIED sampling of a few suspect files on macOS.
#
# WHY THIS EXISTS.  mac-iterate runs the whole suite: ~9 minutes for ONE sample
# of whichever intermittent failure happened to fire that run.  Three of the
# open bugs reproduce only on the constrained macOS runner and at roughly 1 run
# in 5, so the whole-suite loop was costing a ~15 minute round-trip per data
# point -- and the point it returned was not even chosen; it was whatever fired.
#
# This runs ONLY the named files, N times, in the same interpreter setup, and
# reports per-iteration outcomes.  Same wall clock, ~20x the samples, and the
# samples are of the tests actually under investigation.  That is the whole
# point: the bottleneck was never macOS, it was samples per unit time.
#
# IT USES THE PATCHED, PINNED INTERPRETER, and that is a measured requirement,
# not caution.  On the same pinned 3.14.4 a STOCK free-threaded build had six
# files failing that the patched build passes (test_cov95_datastack,
# test_event_inmem_park, test_cov95_tcp_conn, test_swarm_coro_stack,
# test_sysmon_oracle, test_swarm_mn_sched) with symptoms like
# `PREEMPT_HOG_OK flags=b'\x00\x00'` and `pywoke == 0` where 24 was expected.
# A stock interpreter is not a valid oracle for this suite.  Pinning matters
# too: a floating "3.14t" resolved to 3.14.7/Clang 21 and produced two failures
# that vanished at the pinned 3.14.4 -- version drift is evidence about CPython,
# not about macOS.
#
# Free-threading is load-bearing: without it most of the suite silently SKIPS
# and still exits 0 (measured 96 passed vs 12 passed / 84 skipped on three
# files).  RUNLOOM_TEST_NORETRY=1 likewise -- the retry re-runs a failing file
# ALONE and unloaded, a different experiment that rescues precisely the
# load-sensitive failures this lane exists to catch.
#
# TEMPORARY: delete once the remaining macOS bugs are closed.  ci.yml's normal
# triggers are restored, so this is now a targeted sampler alongside it, not a
# replacement for it.
name: mac-loop

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Space-separated test files to loop."
        default: "tests/test_swarm_mn_sched.py tests/test_mn_sim_determinism.py tests/test_cov95_tcp_conn.py"
      iterations:
        description: "How many times to run them."
        default: "20"
      version:
        description: "Pinned CPython (3.13.13 or 3.14.4)."
        default: "3.14.4"
      runner:
        description: "Runner image (macos-14, macos-15, macos-latest). Both open bugs are in the kqueue path, so the OS version is a variable worth controlling."
        default: "macos-14"

permissions:
  contents: read

# Keyed by the file set (and version) so SEVERAL loops run at once -- one per
# bug under investigation.  A single ref-wide group meant dispatching a second
# loop CANCELLED the first, which defeats the whole purpose: these bugs are
# independent and there is no reason to sample them serially.  Re-dispatching
# the SAME file set still supersedes its own previous run, which is what you
# want when you have just pushed a fix for it.
concurrency:
  group: mac-loop-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.version }}-${{ inputs.files }}
  cancel-in-progress: true

jobs:
  loop:
    runs-on: ${{ inputs.runner }}
    name: "mac-loop ${{ inputs.runner }} ${{ inputs.version }} x${{ inputs.iterations }}"
    timeout-minutes: 90
    env:
      RL_CI_TEST_TIMEOUT: "1200"
    steps:
      - uses: actions/checkout@v4

      - name: Configure CI paths
        run: |
          echo "RL_CI_WORK=${{ runner.temp }}/rl-ci" >> "$GITHUB_ENV"
          echo "RL_CI_RELEASE_PREFIX=${{ runner.temp }}/rl-prefix" >> "$GITHUB_ENV"

      - name: Provide patched CPython ${{ inputs.version }}
        uses: ./.github/actions/provide-cpython
        with:
          version: ${{ inputs.version }}
          source: build
          github-token: ${{ github.token }}

      - name: Build runloom extension
        run: tools/ci/test_patched_cpython.sh "${{ inputs.version }}" --only=build-ext

      - name: Resolve interpreter
        run: |
          set -eu
          . tools/ci/lib.sh
          PYBIN="$(cat "${RL_CI_WORK}/pybin-${{ inputs.version }}-$(rl_platform).txt")"
          [ -x "$PYBIN" ] || { echo "::error::no interpreter for ${{ inputs.version }}"; exit 1; }
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
          PYTHON_GIL=0 "$PYBIN" -c '
          import sys, sysconfig
          assert sysconfig.get_config_var("Py_GIL_DISABLED"), "NOT free-threaded"
          print("exe:", sys.executable); print(sys.version)
          '

      - name: Loop
        env:
          PYTHON_GIL: "0"
          RUNLOOM_GIL: "0"
          RUNLOOM_TEST_JOBS: "4"
          RUNLOOM_TIMEOUT_MULT: "2"
          RUNLOOM_TEST_NORETRY: "1"
        run: |
          # NO errexit.  Actions runs `run:` steps under `bash -eo pipefail`, so
          # a failing iteration would abort the whole job -- which is precisely
          # backwards for a sampler: one failure is a data point, not a reason to
          # stop sampling.  (It bit exactly that way once: the DST loop died at
          # iteration 17 of 120 and the signal loop at 25 of 150, each on its
          # first failure, discarding the rest of the run.)
          set +e
          set -u
          N=${{ inputs.iterations }}
          FILES="${{ inputs.files }}"
          fails=0
          # Keep going after a failing iteration -- one failure is a sample, not
          # a reason to stop sampling.  The per-iteration verdict is the output.
          for i in $(seq 1 "$N"); do
            echo "::group::iteration $i/$N"
            # if-form as well as `set +e`: a bare assignment from a failing
            # command substitution is what errexit kills.
            if out="$("$PYBIN" tests/run_isolated.py $FILES 2>&1)"; then rc=0; else rc=$?; fi
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "ITER $i: PASS"
            else
              fails=$((fails + 1))
              # Name the failing file on the ITER line itself: the tally is the
              # point of this job, and digging it out of 20 folded groups
              # afterwards is exactly the archaeology this workflow exists to
              # avoid.
              which=$(printf '%s\n' "$out" | grep -oE 'not-passed \([^)]*\)' | head -1)
              echo "ITER $i: FAIL ${which:-<no summary line>}"
            fi
          done
          echo "================================================"
          echo "LOOP RESULT: $fails/$N iterations failed"
          echo "================================================"
          # The job's own success is not the signal -- the tally is.  Exit 0 so a
          # partial failure rate still publishes cleanly; read LOOP RESULT.
          exit 0
